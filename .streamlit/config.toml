# See https://docs.streamlit.io/develop/concepts/configuration/options
[browser]
gatherUsageStats = false

[theme]
# Trust navy palette (Banking/Traditional Finance); viewers can switch in Settings.
base = "light"
primaryColor = "#1e3a8a"
backgroundColor = "#eef1f6"
secondaryBackgroundColor = "#e2e8f0"
textColor = "#0f172a"
font = "sans serif"
baseRadius = "4px"

[theme.dark]
# Dark variant of the same palette (used when the viewer picks Dark).
primaryColor = "#60a5fa"
backgroundColor = "#0f172a"
secondaryBackgroundColor = "#1e293b"
textColor = "#f8fafc"

[server]
headless = true
enableCORS = true
enableXsrfProtection = true
